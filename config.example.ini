# Copy to ~/.config/photo-manager/config.ini (or pass --config PATH), then fill
# in values for the attached archive volume.  Keep config.ini out of git.

[dest]
root = /Volumes/CameraArchive_M
volume_uuid = EEE32629-5947-39D0-8842-DEA8A879BDF2
subdir = Camera

[source]
# Leave empty to use safe, unambiguous auto-detection in a later phase.
root =

[mirror]
# Configure only after a second archive volume is available.
root =
volume_uuid =

[tools]
# An absolute path is required because launchd and minimal PATHs do not include
# Homebrew by default.
exiftool = /opt/homebrew/bin/exiftool

[options]
hash_algorithm = sha256
free_space_margin = 1.1
eject_after_import = true
